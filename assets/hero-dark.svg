<circle r="5" fill="#25e3f5"><animateMotion dur="5.5s" repeatCount="indefinite" path="M797 110 H855 L891 146"/><animate attributeName="opacity" values=".2;1;.2" dur="5.5s" repeatCount="indefinite"/></circle>
<circle r="4" fill="#ad83ff"><animateMotion dur="6.2s" repeatCount="indefinite" path="M1061 225 H1113 L1131 249"/><animate attributeName="opacity" values=".2;1;.2" dur="6.2s" repeatCount="indefinite"/></circle>
<rect x="68" y="329" width="1064" height="2" rx="1" fill="#29365e"/>
<rect x="68" y="329" width="170" height="2" rx="1" fill="url(#beam)"><animate attributeName="x" values="68;962;68" dur="9s" repeatCount="indefinite"/></rect>
</svg>
