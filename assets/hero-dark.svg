  <rect x="905" y="136" width="120" height="88" rx="12" fill="#121e3b" stroke="#ad83ff" stroke-width="1.8"/>
  <path d="M929 165 h72 M929 181 h72 M929 197 h50" stroke="#25e3f5" stroke-width="2.2" opacity=".68"/>
  <circle cx="1010" cy="197" r="5" fill="#ad83ff" stroke="none"><animate attributeName="r" values="4;7;4" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="966" cy="179" r="115" stroke="#ad83ff" opacity=".15" stroke-dasharray="4 13"/>
