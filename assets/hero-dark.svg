<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Krishna R — AI, embedded systems and software engineering</title>
<desc id="desc">Animated technical header with interconnected circuits, a glowing processor, and a clear professional introduction.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d1e"/><stop offset="1" stop-color="#151334"/></linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#25e3f5"/><stop offset=".53" stop-color="#ad83ff"/><stop offset="1" stop-color="#25e3f5"/></linearGradient>
  <linearGradient id="chipfill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#082c42"/><stop offset="1" stop-color="#121e3b"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#ad83ff" stop-opacity=".22"/><stop offset="1" stop-color="#ad83ff" stop-opacity="0"/></radialGradient>
  <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<rect width="1200" height="360" rx="22" fill="url(#background)"/>
<g stroke="#233455" stroke-width="1" opacity=".22"><path d="M0 0 V360" /><path d="M120 0 V360" /><path d="M240 0 V360" /><path d="M360 0 V360" /><path d="M480 0 V360" /><path d="M600 0 V360" /><path d="M720 0 V360" /><path d="M840 0 V360" /><path d="M960 0 V360" /><path d="M1080 0 V360" /><path d="M1200 0 V360" /><path d="M0 0 H1200" /><path d="M0 60 H1200" /><path d="M0 120 H1200" /><path d="M0 180 H1200" /><path d="M0 240 H1200" /><path d="M0 300 H1200" /><path d="M0 360 H1200" /></g>
<rect x="1.5" y="1.5" width="1197" height="357" rx="21" fill="none" stroke="#29365e" stroke-width="3"/>
<path d="M36 28 H1164" stroke="url(#beam)" stroke-width="3" stroke-linecap="round" opacity=".85"/>
<circle cx="958" cy="173" r="192" fill="url(#halo)"><animate attributeName="opacity" values=".65;1;.65" dur="6s" repeatCount="indefinite"/></circle>
<g font-family="Arial, Helvetica, sans-serif">
  <text x="70" y="85" font-size="18" font-weight="700" letter-spacing="5" fill="#25e3f5">SYSTEMS  /  INTELLIGENCE  /  HARDWARE</text>
  <text x="66" y="181" font-size="86" font-weight="800" letter-spacing="1" fill="#f5f9ff">KRISHNA <tspan fill="#ad83ff">R</tspan></text>
  <text x="70" y="227" font-size="25" font-weight="500" fill="#99a9c7">Building intelligent systems from edge to cloud</text>
  <text x="70" y="289" font-size="17" font-weight="700" letter-spacing="3" fill="#25e3f5">AI / ML</text>
  <text x="213" y="289" font-size="17" fill="#99a9c7">•</text>
  <text x="245" y="289" font-size="17" font-weight="700" letter-spacing="3" fill="#ad83ff">EMBEDDED</text>
  <text x="391" y="289" font-size="17" fill="#99a9c7">•</text>
  <text x="423" y="289" font-size="17" font-weight="700" letter-spacing="3" fill="#25e3f5">SOFTWARE</text>
</g>
<!-- right-side processor artwork; core text remains readable when animation is disabled -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M797 110 H855 L891 146 M1040 132 H1089 L1117 104 M1061 225 H1113 L1131 249 M853 244 H801 L779 267" stroke="#25e3f5" stroke-width="2.5" opacity=".63"/>
